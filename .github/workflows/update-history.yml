name: Update candle history

on:
  schedule:
    - cron: "17 7 * * *"   # daily; the chart overlays live GeckoTerminal candles for the most recent period
  workflow_dispatch:
    inputs:
      full:
        description: "Re-fetch the full available history (normally only new candles are added)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Grow assets/history (GeckoTerminal on-chain + Gate.io)
        run: python scripts/update_history.py ${{ inputs.full && '--full' || '' }}
      - name: Commit if changed
        run: |
          git config user.name "snek-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/history
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update candle history $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
