name: Update data snapshot

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay scheduled runs)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate assets/snapshot.js and assets/snapshot.json
        run: python scripts/update_snapshot.py
      - name: Commit if changed
        run: |
          git config user.name "snek-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snapshot.js assets/snapshot.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update data snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
